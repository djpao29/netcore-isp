[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/nginx_stderr.log
stdout_logfile=/var/log/supervisor/nginx_stdout.log
user=root

[program:php-fpm]
command=php-fpm -F --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/php-fpm_stderr.log
stdout_logfile=/var/log/supervisor/php-fpm_stdout.log
user=root

[program:cron]
command=crond -f -l 2 -L /var/log/cron.log
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/cron_stderr.log
stdout_logfile=/var/log/supervisor/cron_stdout.log
user=root

[group:netcore]
programs=nginx,php-fpm,cron