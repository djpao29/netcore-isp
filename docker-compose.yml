version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mariadb:10.6
    container_name: netcore-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-netcore_isp}
      MYSQL_USER: ${DB_USERNAME:-isp_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-isppassword}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - netcore-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis for caching/sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: netcore-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - netcore-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application (PHP + Nginx + Node.js for dev)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: netcore-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-netcore_isp}
      - DB_USERNAME=${DB_USERNAME:-isp_user}
      - DB_PASSWORD=${DB_PASSWORD:-isppassword}
      - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpassword}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANYROUTER_API_KEY=${ANYROUTER_API_KEY}
      - ANYROUTER_BASE_URL=${ANYROUTER_BASE_URL:-https://anyrouter.dev/api/v1}
      - AI_MODEL=${AI_MODEL:-anyrouter/free}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./storage:/var/www/html/storage
      - ./public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - netcore-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/bootstrap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service (with hot reload)
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-builder
    container_name: netcore-app-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - APP_URL=http://localhost:3000
      - VITE_API_URL=http://localhost:3000/api
    ports:
      - "3000:3000"
      - "24678:24678" # Vite HMR
    volumes:
      - ./src:/app/src
      - ./shared:/app/shared
      - ./server.ts:/app/server.ts
      - ./server.modules.ts:/app/server.modules.ts
      - ./mikrotik.ts:/app/mikrotik.ts
      - ./shared:/app/shared
      - ./vite.config.ts:/app/vite.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./index.html:/app/index.html
      - ./public:/app/public
    depends_on:
      - mysql
      - redis
    networks:
      - netcore-network
    command: npm run dev

  # Cron worker for scheduled tasks
  cron:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: netcore-cron
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-netcore_isp}
      - DB_USERNAME=${DB_USERNAME:-isp_user}
      - DB_PASSWORD=${DB_PASSWORD:-isppassword}
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - netcore-network
    command: |
      bash -c "
      echo 'Starting cron scheduler...'
      while true; do
        php /var/www/html/artisan schedule:run >> /var/www/html/storage/logs/cron.log 2>&1
        sleep 60
      done
      "

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  netcore-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16